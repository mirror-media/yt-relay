steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA"
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA"

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        case "$BRANCH_NAME" in
          master) ENV="prod" ;;
          stag) ENV="staging" ;;
          *) ENV="dev" ;;
        esac

        echo "Branch $BRANCH_NAME -> deploying ${_SERVICE_PREFIX}-$$ENV"

        gcloud run deploy "${_SERVICE_PREFIX}-$$ENV" \
          --image=gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --port=8080 \
          --allow-unauthenticated

images:
  - "gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$COMMIT_SHA"

substitutions:
  _REGION: asia-east1
  _IMAGE_NAME: yt-relay
  _SERVICE_PREFIX: yt-relay
